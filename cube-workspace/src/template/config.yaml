model_config: {}

skills:
  disabled: []

gateway_options:
  local/ollama:
    base_url: http://127.0.0.1:11434
  local/lmstudio:
    base_url: http://127.0.0.1:1234/v1

theme: default

app_title:
  - workspace
  - threadId

status_line:
  - workspace
  - model

telemetry: false

subagents:
  concurrency: 2
  model: inherit
  # reasoning_effort: medium # Shared optional default; custom role Markdown wins.
  timeout_ms: 0 # No timeout. Positive milliseconds include approval waits, not queue time.

background_tasks:
  enabled: true
  concurrency: 2
  timeout_ms: 300000
  # 0 means no deadline. execute_command timeout:null overrides this per command.

truncation_policy:
  execute_command:
    max_bytes: 262144 # Preview ceiling, not a log-file size cap or token budget.
    max_lines: 200 # Default preview lines; explicit tool tail can request up to 2000.
  # Larger output is preserved for manage_task get with cursor: 0.
  # Logs are temporary and removed when this Cube runtime exits.

soul:
  max_characters: 2000

memory:
  # When disabled, Cube derives the title from the first user prompt without
  # an LLM call. model accepts inherit or a concrete provider/model ID.
  generate_title:
    enabled: false
    model: inherit
    # reasoning_effort: low
    instructions: Generate a concise title under 80 characters.

  compaction:
    # inherit uses the active chat model; a model ID overrides only summarization.
    model: inherit
    # reasoning_effort: low
    # /compact requires this fraction of the model context plus a safe cut.
    manual_min_ratio: 0.30
    # Fraction of conversation capacity retained after reserving instructions
    # and the new summary. Tool exchanges are never split.
    keep_recent_ratio: 0.20
    # Generation/counting reserve, not a fixed summary length.
    reserve_tokens: 16384

  durable:
    # Background extraction/consolidation consumes normal provider usage.
    enabled: true
    model: inherit
    # reasoning_effort: low
    min_idle_hours: 6
    # Hybrid search over this project's committed Markdown memory, not raw history.
    # API embeddings consume provider usage; local models use CPU/RAM/GPU.
    retrieval:
      enabled: false
      model: null
      # Change revision to rebuild when a model alias changes its weights.
      revision: null
      dimensions: null
      document_prefix: ""
      query_prefix: ""
      provider_options:
        document: {}
        query: {}
      chunk:
        max_chars: 1024
        overlap_chars: 128
      # Local Nomic example: model: ollama/nomic-embed-text:latest
      # document_prefix: "search_document: "
      # query_prefix: "search_query: "
