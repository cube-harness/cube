model_config: {}

skills:
  disabled: []

gateway_options:
  local/ollama:
    base_url: http://127.0.0.1:11434
  local/lmstudio:
    base_url: http://127.0.0.1:1234/v1

theme: default

app_title:
  - workspace
  - threadId

status_line:
  - workspace
  - model

telemetry: false

soul:
  max_characters: 20000

memory:
  # Cube currently supports only local SQLite storage. Cube owns the database
  # ID, URL and <CubeHome>/memories/memory.sqlite path.
  storage:
    provider: sqlite
    mode: local

  # Optional vector storage for Semantic Recall.
  vector:
    enabled: false
    provider: sqlite
    mode: local

  # Required for vector search. When enabled, model must be a concrete
  # embedding model ID such as openai/text-embedding-3-small.
  embedder:
    enabled: false
    model: null

  # When disabled, Cube derives the title from the first user prompt without
  # an LLM call. model accepts inherit or a concrete provider/model ID.
  generate_title:
    enabled: false
    model: inherit
    instructions: Generate a concise title under 80 characters.

  # RAG search over historical raw messages. Enabling this requires both
  # vector.enabled and embedder.enabled.
  semantic_recall:
    enabled: false
    top_k: 4
    message_range:
      before: 1
      after: 1
    scope: resource
    # null disables similarity-score filtering.
    threshold: null

  compaction:
    # inherit uses the active chat model; a model ID overrides only summarization.
    model: inherit
    # /compact requires this fraction of the model context plus a safe cut.
    manual_min_ratio: 0.30
    # Fraction of conversation capacity retained after reserving instructions
    # and the new summary. Tool exchanges are never split.
    keep_recent_ratio: 0.20
    # Generation/counting reserve, not a fixed summary length.
    reserve_tokens: 16384

  durable:
    # Background extraction/consolidation consumes normal provider usage.
    enabled: true
    model: inherit
    min_idle_hours: 6
