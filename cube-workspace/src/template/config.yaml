model_config: {}

gateway_options:
  local/ollama:
    base_url: http://127.0.0.1:11434
  local/lmstudio:
    base_url: http://127.0.0.1:1234/v1

theme: default

app_title:
  - model
  - workspace
  - threadId

status_line:
  - model
  - workspace
  - agentMd
  - threadId

telemetry: false

soul:
  max_characters: 20000

memory:
  # Cube currently supports only local SQLite storage. Cube owns the database
  # ID, URL and <CubeHome>/memories/memory.sqlite path.
  storage:
    provider: sqlite
    mode: local

  # Optional vector storage for Semantic Recall.
  vector:
    enabled: false
    provider: sqlite
    mode: local

  # Required for vector search. When enabled, model must be a concrete
  # embedding model ID such as openai/text-embedding-3-small.
  embedder:
    enabled: false
    model: null

  # When disabled, Cube derives the title from the first user prompt without
  # an LLM call. model accepts inherit or a concrete provider/model ID.
  generate_title:
    enabled: false
    model: inherit
    instructions: Generate a concise title under 80 characters.

  # RAG search over historical raw messages. Enabling this requires both
  # vector.enabled and embedder.enabled.
  semantic_recall:
    enabled: false
    top_k: 4
    message_range:
      before: 1
      after: 1
    scope: resource
    # null disables similarity-score filtering.
    threshold: null

  working_memory:
    enabled: true
    scope: thread
    # With state signals, the main-agent tool is named setWorkingMemory when
    # agent_managed is enabled.
    use_state_signals: true
    # Saved state is read-only by default. Set true to expose the main-agent
    # Working Memory tool. Compaction does not update working memory.
    agent_managed: false
    template: |
      # Thread Task State

      ## Objective

      ## Success Criteria

      ## Constraints

      ## Decisions

      ## Progress

      ## Working Set

      ## Blockers

      ## Next Action

  compaction:
    # /compact requires this fraction of the model context plus a safe cut.
    manual_min_ratio: 0.30
    # Fraction of conversation capacity retained after reserving instructions
    # and the new summary. Tool exchanges are never split.
    keep_recent_ratio: 0.25
    # Generation/counting reserve, not a fixed summary length.
    reserve_tokens: 16384

permissions:
  require_approval_for:
    - execute_command
    - edit_file
    - write_file
    - apply_patch
