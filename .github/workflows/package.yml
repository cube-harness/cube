name: Cube package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload verified builds to R2
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cube-distribution
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            output: windows
          - runner: ubuntu-22.04
            target: linux-x64
            output: linux-x64
          - runner: macos-14
            target: darwin-arm64
            output: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
            output: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:app
      - name: Verify Unix installer
        if: runner.os != 'Windows'
        run: node scripts/install-smoke.mjs build/${{ matrix.output }}/cube-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cube-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/${{ matrix.output }}/cube-*.zip
            build/${{ matrix.output }}/cube-*.tar.gz
            build/${{ matrix.output }}/cube-*.sha256
            build/${{ matrix.output }}/latest-*.txt
            build/${{ matrix.output }}/latest.json
            build/${{ matrix.output }}/install.*
  publish:
    needs: package
    if: inputs.publish
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cube-*
          path: packages
      - name: Publish to R2 (manual opt-in)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY -or -not $env:R2_ENDPOINT -or -not $env:R2_BUCKET) { throw 'Missing R2 configuration.' }
          function Upload($source, $key, $cache, $contentType) {
            aws s3 cp $source "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT --cache-control $cache --content-type $contentType
            if ($LASTEXITCODE) { throw "Upload failed: $key" }
          }
          # Upload every immutable archive before updating any installer/manifest.
          $windows = 'packages/cube-windows-x64'
          $manifest = Get-Content "$windows/latest.json" -Raw | ConvertFrom-Json
          $manifest.file = "releases/$($manifest.sha256.Substring(0,16))/cube-windows-x64.zip"
          $manifest | ConvertTo-Json | Set-Content "$windows/latest.json" -Encoding utf8
          Upload "$windows/cube-windows-x64.zip" $manifest.file 'public,max-age=31536000,immutable' 'application/zip'
          $unixTargets = @('linux-x64', 'darwin-arm64', 'darwin-x64')
          foreach ($target in $unixTargets) {
            $directory = "packages/cube-$target"
            $remoteFile = ((Get-Content "$directory/latest-$target.txt" -Raw).Trim() -split '\s+')[1]
            Upload "$directory/cube-$target.tar.gz" $remoteFile 'public,max-age=31536000,immutable' 'application/gzip'
          }
          Upload "$windows/install.ps1" 'install.ps1' 'no-cache' 'text/plain; charset=utf-8'
          Upload 'packages/cube-linux-x64/install.sh' 'install.sh' 'no-cache' 'text/plain; charset=utf-8'
          Upload "$windows/latest.json" 'latest.json' 'no-cache' 'application/json'
          foreach ($target in $unixTargets) {
            Upload "packages/cube-$target/latest-$target.txt" "latest-$target.txt" 'no-cache' 'text/plain; charset=utf-8'
          }
